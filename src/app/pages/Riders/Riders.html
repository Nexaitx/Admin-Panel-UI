<mat-tab-group (selectedIndexChange)="onTabChange($event)">
    <mat-tab label="Rider Owners"></mat-tab>
    <mat-tab label="Riders"></mat-tab>
</mat-tab-group>

<div class="p-4">

    @if(tab === 'owners') {
        <app-riders-owners></app-riders-owners>
    }

    @else {
        <app-riders></app-riders>
    }

</div>
